<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Emulsion — Project</title>
<style>
  :root { --bg:#15171c; --panel:#1f232b; --line:#333945; --fg:#d7dbe2; --dim:#8b93a1; --acc:#e0a458; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.5 ui-sans-serif, system-ui, sans-serif;
    padding:28px 36px 80px; }
  h1 { font-size:22px; color:var(--acc); margin-bottom:2px; }
  h1 small { color:var(--dim); font-weight:400; font-size:13px; margin-left:8px; }
  h2 { font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:0.08em;
    margin:30px 0 12px; border-bottom:1px solid var(--line); padding-bottom:6px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card .name { font-weight:600; margin-bottom:4px; }
  .card .meta { color:var(--dim); font-size:12px; margin-bottom:10px; }
  .card button { background:#2a2f3a; color:var(--fg); border:1px solid var(--line); border-radius:6px;
    padding:4px 10px; font:inherit; font-size:12px; cursor:pointer; }
  .card button:hover { border-color:var(--acc); color:var(--acc); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px; }
  .grid .tile { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .grid img, .grid video { width:100%; display:block; aspect-ratio:16/9; object-fit:cover; cursor:pointer; }
  .grid .cap { padding:7px 10px; font-size:11.5px; color:var(--dim); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .grid .cap .open { background:none; border:1px solid var(--line); border-radius:4px; color:var(--fg);
    cursor:pointer; font-size:11px; padding:1px 5px; flex-shrink:0; }
  .grid .cap .open:hover { border-color:var(--acc); }
  .grid a.filecard { display:block; padding:16px 10px; color:var(--fg); text-decoration:none; font-size:12.5px; }
  .grid a.filecard:hover { color:var(--acc); }
  .empty { color:var(--dim); font-size:13px; }
  #status { position:fixed; top:52px; right:24px; color:var(--acc); font-size:12px; }
  .back { position:fixed; top:20px; right:24px; color:var(--fg); text-decoration:none; font-size:13px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 14px; }
  .back:hover { border-color:var(--acc); color:var(--acc); }
  .card, .grid .tile { transition:border-color .15s, transform .15s; }
  .card:hover, .grid .tile:hover { border-color:#59617a; transform:translateY(-1px); }
</style>
</head>
<body>
<h1>🎞️ Emulsion <small>project — everything on the table</small>
  <select id="projSel" title="Project filter" style="margin-left:14px; background:var(--panel); color:var(--fg);
    border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:13px;"></select></h1>
<a class="back" href="/">🎬 Back to stage</a>
<div id="status"></div>

<h2 id="shotsH">🎬 Shots</h2>
<div id="shots" class="cards"><span class="empty">none yet</span></div>

<h2 id="setsH">🏞 Sets</h2>
<div id="sets" class="cards"><span class="empty">none yet</span></div>

<h2 id="assetsH">🗂 Assets</h2>
<div id="assets" class="grid"><span class="empty">none yet</span></div>

<script>
const $ = (id) => document.getElementById(id);

// project filter — shared selection with the stage via localStorage
let PROJECTS = [];
let curProject = localStorage.getItem('emulsionProject') || 'All';
function projMatch(name) {
  if (curProject === 'All') return true;
  const p = PROJECTS.find((p) => p.name === curProject);
  if (!p) return true;
  const n = name.toLowerCase();
  return p.prefixes.some((pre) => n.startsWith(pre));
}
async function loadProjects() {
  try { PROJECTS = (await (await fetch('/projects.json')).json()).projects || []; } catch { PROJECTS = []; }
  const sel = $('projSel');
  sel.innerHTML = '';
  for (const name of ['All', ...PROJECTS.map((p) => p.name)]) {
    const o = document.createElement('option');
    o.value = o.textContent = name;
    sel.append(o);
  }
  if (![...sel.options].some((o) => o.value === curProject)) curProject = 'All';
  sel.value = curProject;
  sel.onchange = () => {
    curProject = sel.value;
    localStorage.setItem('emulsionProject', curProject);
    refresh();
  };
}

async function postOp(op, msg) {
  await fetch('/op', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(op) });
  $('status').textContent = msg + ' — heading to the stage…';
  setTimeout(() => (location.href = '/'), 500); // staging takes you back to the workspace
}

async function loadLibrary(kind, el, actionLabel, toOp) {
  const names = (await (await fetch('/' + kind)).json()).filter(projMatch);
  const details = [];
  for (const name of names) {
    details.push(await (await fetch('/' + kind + '/' + encodeURIComponent(name))).json());
  }
  const sig = curProject + JSON.stringify(names) + details.map((d) => (d.objects || []).length).join();
  if (el.dataset.sig === sig) return; // nothing changed — don't rebuild (rebuilds flicker)
  el.dataset.sig = sig;
  const h = $(kind + 'H');
  if (h) h.textContent = h.textContent.replace(/ \(\d+\)/, '') + ' (' + names.length + ')';
  el.innerHTML = names.length ? '' : '<span class="empty">none yet</span>';
  names.forEach((name, i) => {
    const detail = details[i];
    const objs = (detail.objects || []).length;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="name">${name}</div>
      <div class="meta">${objs} objects${detail.duration ? ' · ' + detail.duration + 's' : ''}</div>`;
    const b = document.createElement('button');
    b.textContent = actionLabel;
    b.onclick = () => postOp(toOp(name, detail), `${actionLabel}: ${name}`);
    card.append(b);
    el.append(card);
  });
}

function assetRank(f) {
  if (/\.(png|jpe?g|webp|gif)$/i.test(f)) return 0;   // images first
  if (/\.(mp4|webm|mov)$/i.test(f)) return 1;         // then video
  return 2;                                            // then docs / other
}
function orderAssets(list) {
  return [...list].sort((a, b) => assetRank(a) - assetRank(b) || a.localeCompare(b));
}
async function loadAssets() {
  const files = orderAssets((await (await fetch('/assets.json')).json()).filter(projMatch));
  const el = $('assets');
  const sig = curProject + JSON.stringify(files);
  if (el.dataset.sig === sig) return; // unchanged — keep playing videos untouched
  el.dataset.sig = sig;
  $('assetsH').textContent = '🗂 Assets (' + files.length + ')';
  el.innerHTML = files.length ? '' : '<span class="empty">none yet</span>';
  for (const f of files) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    const openBtn = `<button class="open" onclick="fetch('/open',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:'${f}'})})" title="Reveal in Finder">📂</button>`;
    if (/\.(png|jpe?g|webp|gif)$/i.test(f)) {
      tile.innerHTML = `<img src="assets/${f}" loading="lazy" onclick="window.open('assets/${f}')">
        <div class="cap">${f} ${openBtn}</div>`;
    } else if (/\.(mp4|webm|mov)$/i.test(f)) {
      tile.innerHTML = `<video src="assets/${f}" controls preload="metadata"></video><div class="cap">${f} ${openBtn}</div>`;
    } else {
      tile.innerHTML = `<a class="filecard" href="assets/${f}" target="_blank">📄 ${f}</a><div class="cap">${openBtn}</div>`;
    }
    el.append(tile);
  }
}

async function refresh() {
  try {
    await Promise.all([
      loadLibrary('shots', $('shots'), '▶ Stage this shot', (name, spec) =>
        ({ type: 'spec', spec, note: '🎬 Staged shot: ' + name })),
      loadLibrary('sets', $('sets'), '🏗 Stage this set', (name, set) =>
        ({ type: 'spec',
           spec: { duration: 5, objects: set.objects || [],
                   camera: { keys: [{ t: 0, pos: [8, 3, 10], lookAt: [0, 1, 0], fov: 40 }] } },
           note: '🏞 Staged set: ' + name })),
      loadAssets(),
    ]);
  } catch {
    $('status').textContent = 'bridge offline';
  }
}
loadProjects().then(refresh);
setInterval(refresh, 6000);
</script>
</body>
</html>
